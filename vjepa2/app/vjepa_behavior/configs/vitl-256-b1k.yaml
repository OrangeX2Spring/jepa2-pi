# Stage 1b: Train fresh AC predictor on BEHAVIOR-1K latents
# Training runs until convergence (ReduceLROnPlateau decays LR on plateau;
# stops when LR hits min_lr). Resubmit the SLURM job as many times as needed.

data:
  crop_size:    256
  patch_size:   16
  tubelet_size: 2

model:
  pred_depth:              12
  pred_embed_dim:         384
  pred_num_heads:          12
  use_rope:               true
  use_activation_checkpointing: false

optimization:
  batch_size:      192       # ~14-16 GB GPU mem; above the 12 GB cluster kill threshold
  lr:           4.0e-4
  weight_decay:   0.04
  lr_decay_factor: 0.5      # multiply LR by this on plateau
  lr_patience:    1000      # steps of no improvement before LR decay
  min_lr:       1.0e-6      # stop training when LR reaches this floor

meta:
  log_freq:        100      # steps between loss/lr/gpu log lines
  save_every:      500      # overwrite latest.pt every N steps
  snapshot_every: 2000      # permanent step_XXXXXX.pt every N steps
